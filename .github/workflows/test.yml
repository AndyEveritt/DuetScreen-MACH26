name: C/C++ CI

on:
    push:
    pull_request:

jobs:
    test:
        name: Run CTest
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                submodules: recursive
                fetch-depth: 0
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install dependencies
              run: sudo apt-get update && ./scripts/install_prerequisites.sh

            - name: Update Version
              run: |
                ./scripts/update_version.sh "${{ github.ref_name }}"
                echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

            - name: Configure project
              run: cmake --preset Test

            - name: Build project
              run: cmake --build --preset Test

            - name: Run CTest
              id: run_ctest
              run: ctest --test-dir out/build/Test --output-on-failure
            
            - name: Run Coverage
              run: |
                mkdir -p tests/report
                gcovr out/build/Test --root . --filter src --xml tests/report/coverage.xml -j $(nproc) --print-summary

            - name: Code Coverage Report
              uses: irongut/CodeCoverageSummary@v1.3.0
              with:
                filename: tests/report/coverage.xml
                badge: true
                fail_below_min: false
                format: markdown
                hide_branch_rate: false
                hide_complexity: true
                indicators: true
                output: both
                thresholds: '60 80'
            
            - name: Add Coverage PR Comment
              uses: marocchino/sticky-pull-request-comment@v2
              if: github.event_name == 'pull_request'
              with:
                recreate: true
                path: code-coverage-results.md

            - name: Detect error images
              id: detect_err_images
              if: always()
              run: |
                ERR_COUNT=$(find tests/ref_imgs -type f -name "*_err.*" | wc -l || true)
                if [ "$ERR_COUNT" -gt 0 ]; then
                  echo "has_errors=true" >> "$GITHUB_OUTPUT"
                  echo "Found $ERR_COUNT error image(s)."
                  # List them for the log
                  find tests/ref_imgs -type f -name "*_err.*"
                else
                  echo "has_errors=false" >> "$GITHUB_OUTPUT"
                  echo "No error images found."
                fi

            - name: Upload error images artifact
              if: always() && steps.detect_err_images.outputs.has_errors == 'true'
              uses: actions/upload-artifact@v4
              with:
                name: ctest-error-images
                path: |
                  tests/ref_imgs/*_err.*
                if-no-files-found: error
  
            