name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Generate Changelog
        if: matrix.os == 'ubuntu-latest'
        id: changelog
        run: |
          VERSION_INFO=$(cat version_compatibility.json)
          MIN_VERSION=$(echo $VERSION_INFO | jq -r .minCompatibleVersion)
          MAX_VERSION=$(echo $VERSION_INFO | jq -r .maxCompatibleVersion)
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "Version Compatibility:" >> $GITHUB_ENV
          echo "- Minimum Compatible RRF Version: $MIN_VERSION" >> $GITHUB_ENV
          if [ "$MAX_VERSION" != "null" ]; then
            echo "- Maximum Compatible RRF Version: $MAX_VERSION" >> $GITHUB_ENV
          fi
          echo "" >> $GITHUB_ENV
          echo "Changes:" >> $GITHUB_ENV
          ./scripts/changelog.sh >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsdl2-dev \
            libsdl2-image-dev \
            libusb-1.0-0-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libfreetype-dev \
            pkg-config \
            jq

      - name: Install Windows Dependencies
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install sdl2:x64-windows
          vcpkg install sdl2-image:x64-windows
          vcpkg install libusb:x64-windows
          vcpkg install ffmpeg:x64-windows
          vcpkg install freetype:x64-windows
          vcpkg integrate install

      - name: Configure CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja --preset Simulation-Release

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" --preset Simulation-Release

      - name: Build
        run: cmake --build build

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir artifacts
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp build/DuetScreen.exe artifacts/
          else
            cp build/DuetScreen artifacts/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: DuetScreen-${{ matrix.os }}
          path: artifacts/*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        with:
          files: artifacts/*
          body: ${{ env.CHANGELOG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}