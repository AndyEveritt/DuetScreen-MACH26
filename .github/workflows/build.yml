name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Changelog
        if: matrix.os == 'ubuntu-latest'
        id: changelog
        run: |   
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          ./scripts/release_notes.sh >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./scripts/install_prerequisites.sh

      - name: Install Windows Dependencies
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install sdl2:x64-windows
          vcpkg install sdl2-image:x64-windows
          vcpkg install libusb:x64-windows
          vcpkg install ffmpeg:x64-windows
          vcpkg install freetype:x64-windows
          vcpkg integrate install

      - name: Configure CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja --preset Simulation-Release

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" --preset Simulation-Release

      - name: Build
        run: cmake --build build

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir artifacts
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp build/DuetScreen.exe artifacts/
          else
            cp build/DuetScreen artifacts/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuetScreen-${{ matrix.os }}
          path: artifacts/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        with:
          files: artifacts/*
          body: ${{ env.CHANGELOG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}